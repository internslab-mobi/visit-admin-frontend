<div class="landing-page">

  <!-- Background -->
  <img
    class="background-image"
    src="/images/landing.png"
    alt="Modern corporate office lobby"
  />

  <!-- No overlay -->
  <div class="left-overlay"></div>


  <!-- Main content -->
  <div class="landing-content">

    <!-- Brand -->
    <div class="brand-section">

      <div class="brand-line"></div>

      <div class="brand-name">
        VMS
      </div>

      <div class="brand-subtitle">
        VISITOR MANAGEMENT SYSTEM
      </div>

    </div>


    <!-- Hero -->
    <div class="hero-section">

      <h1>
        EVERY VISITOR
        <br />

        <span>
          MATTERS !
        </span>
      </h1>


      <p class="description">
        Manage visitors, guests and vendors with
        confidence and control.
      </p>


      <!-- Features -->
      <div class="features">

        <div class="feature">
          <div class="feature-icon">
            ♢
          </div>

          <div>
            Secure
          </div>
        </div>


        <div class="feature">
          <div class="feature-icon">
            ♧
          </div>

          <div>
            Seamless
          </div>
        </div>


        <div class="feature">
          <div class="feature-icon">
            ⚙
          </div>

          <div>
            Efficient
          </div>
        </div>

      </div>


      <!-- Get Started -->
      <button
        class="get-started-btn"
        type="button"
        (click)="getStarted()"
      >

        <span>
          Get Started
        </span>

        <span class="arrow-circle">
          →
        </span>

      </button>

    </div>

  </div>


  <!-- =================================
       BOTTOM TAGLINE
       OUTSIDE landing-content
  ================================== -->

 
</div>
<div class="bottom-tagline">

  <div class="bottom-line"></div>

  <span>
    PEOPLE · PLACES · PROGRESS
  </span>

</div>
