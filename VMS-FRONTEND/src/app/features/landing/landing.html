<div class="landing-page">

  <!-- =================================
       FULL SCREEN BACKGROUND IMAGE
  ================================== -->

  <img
    class="background-image"
    src="/images/landing.png"
    alt="Modern corporate office lobby"
  />


  <!-- =================================
       OVERLAY
       Hidden through CSS
  ================================== -->

  <div class="left-overlay"></div>


  <!-- =================================
       MAIN CONTENT
  ================================== -->

  <div class="landing-content">


    <!-- =================================
         BRAND
    ================================== -->

    <div class="brand-section">

      <!-- Purple accent line -->
      <div class="brand-line"></div>

      <!-- VMS -->
      <div class="brand-name">
        VMS
      </div>

      <!-- Subtitle -->
      <div class="brand-subtitle">
        VISITOR MANAGEMENT SYSTEM
      </div>

    </div>


    <!-- =================================
         HERO SECTION
    ================================== -->

    <div class="hero-section">

      <!-- Main heading -->
      <h1>
        EVERY VISITOR
        <br />

        <span>
          MATTERS !
        </span>
      </h1>


      <!-- Description -->
      <p class="description">
        Manage visitors, guests and vendors with
        confidence and control.
      </p>


      <!-- =================================
           FEATURES
      ================================== -->

      <div class="features">


        <!-- Secure -->
        <div class="feature">

          <div class="feature-icon">
            ♢
          </div>

          <div>
            Secure
          </div>

        </div>


        <!-- Seamless -->
        <div class="feature">

          <div class="feature-icon">
            ♧
          </div>

          <div>
            Seamless
          </div>

        </div>


        <!-- Efficient -->
        <div class="feature">

          <div class="feature-icon">
            ⚙
          </div>

          <div>
            Efficient
          </div>

        </div>

      </div>


      <!-- =================================
           GET STARTED BUTTON
      ================================== -->

      <button
        class="get-started-btn"
        type="button"
        (click)="getStarted()"
      >

        <span>
          Get Started
        </span>

        <span class="arrow-circle">
          →
        </span>

      </button>

    </div>


    <!-- =================================
         BOTTOM TAGLINE
    ================================== -->

    <div class="bottom-tagline">

      <!-- Purple accent line -->
      <div class="bottom-line"></div>

      <!-- Tagline -->
      <span>
        PEOPLE · PLACES · PROGRESS
      </span>

    </div>


  </div>

</div>
